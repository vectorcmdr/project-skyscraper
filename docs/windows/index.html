<script>
(function(){
  'use strict';

  /* ---- constants ---- */
  const COLS = 131;
  const ROWS = 541;
  const CELL_SIZE = 2;
  const GAP = 1;
  const STEP = CELL_SIZE + GAP;
  const PIXELS_PER_GRID = COLS * ROWS;
  const TOTAL_PIXELS = PIXELS_PER_GRID * 3;

  const publicationDate = '2026-07-05T16:16:16Z';
  const pixelColor = 'rgba(4,135,157,1)';
  const playerColor = '#ffffff';

  /* ---- DOM refs ---- */
  const canvases = [
    document.getElementById('grid1'),
    document.getElementById('grid2'),
    document.getElementById('grid3')
  ];
  const contexts = canvases.map(c => c.getContext('2d', { alpha: true }));
  const counterEl = document.getElementById('counter-display');
  const counter3dEl = document.getElementById('counter-display-3d');
  function setCounterText(t) {
    counterEl.textContent = t;
    if (counter3dEl) counter3dEl.textContent = t;
  }
  const statusEl = document.getElementById('status-line');
  const inputEl = document.getElementById('prime-input');

  /* ---- state ---- */
  let litPixels = new Set();
  let highlightBoxes = [];
  let persistInterval = null;
  let liveInterval = null;
  let showingComplete = false;
  let lastHighlighted = [];
  let operatorBoxes = [];
  let operatorsData = null;
  let opLookup = {};
  let canvasRects = [null, null, null];
  let lensRAF = null;

  window.__countingState = {
    canvases: canvases,
    contexts: contexts,
    COLS: COLS,
    ROWS: ROWS,
    STEP: STEP,
    CELL_SIZE: CELL_SIZE,
    GAP: GAP,
    PIXELS_PER_GRID: PIXELS_PER_GRID,
    TOTAL_PIXELS: TOTAL_PIXELS,
    isPrime: isPrime,
    playerColorFor: playerColorFor,
    opLookup: opLookup,
    pixelColor: pixelColor,
    dirty: false,
    highlightIndices: [],
    highlightsDirty: false,
    clearHighlights: null,
    clearOperatorHighlights: null,
  };
  function markDirty() { window.__countingState.dirty = true; }
  function markHighlightsDirty() { window.__countingState.highlightsDirty = true; }

  /* ---- helpers ---- */
  function isPrime(n) {
    if (n <= 1) return false;
    if (n <= 3) return true;
    if (n % 2 === 0 || n % 3 === 0) return false;
    for (let i = 5; i * i <= n; i += 6) {
      if (n % i === 0 || n % (i + 2) === 0) return false;
    }
    return true;
  }

  function parseInput() {
    return inputEl.value.split(/[,\s\n]+/)
      .map(s => parseInt(s.trim()))
      .filter(n => !isNaN(n) && n > 0 && n <= TOTAL_PIXELS);
  }

  function playerColorFor(idx) {
    var info = opLookup[idx];
    return (info && info.color !== '') ? '#' + info.color : playerColor;
  }

  /* ---- grid drawing ---- */
  function addRandomPixel() {
    if (litPixels.size >= TOTAL_PIXELS) return;
    let globalIndex;
    do {
      globalIndex = Math.floor(Math.random() * TOTAL_PIXELS);
    } while (litPixels.has(globalIndex));
    litPixels.add(globalIndex);

    const gridIndex = Math.floor(globalIndex / PIXELS_PER_GRID);
    const local = globalIndex % PIXELS_PER_GRID;
    const x = local % COLS;
    const y = Math.floor(local / COLS);
    const ctx = contexts[gridIndex];
    const isPlayerWindow = isPrime(globalIndex + 1);
    ctx.fillStyle = isPlayerWindow ? playerColorFor(globalIndex) : pixelColor;
    ctx.fillRect(x * STEP, y * STEP, CELL_SIZE, CELL_SIZE);
  }

  function initGrids() {
    const now = Date.now();
    const startTime = new Date(publicationDate).getTime();
    let elapsed = Math.floor((now - startTime) / 1000);
    if (elapsed < 0) elapsed = 0;
    const toLight = Math.min(elapsed, TOTAL_PIXELS);
    for (let i = 0; i < toLight; i++) {
      addRandomPixel();
    }
  }

  function updateCounter() {
    const startTime = new Date(publicationDate).getTime();
    const now = Date.now();
    let elapsed = Math.floor((now - startTime) / 1000);
    if (elapsed < 0) elapsed = 0;
    const capped = Math.min(elapsed, TOTAL_PIXELS);
    setCounterText(String(capped).padStart(8, '0'));
    while (litPixels.size < capped) {
      addRandomPixel();
    }
    markDirty();
  }

  function startLive() {
    if (liveInterval) clearInterval(liveInterval);
    contexts.forEach(ctx => {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    });
    litPixels = new Set();
    initGrids();
    updateCounter();
    liveInterval = setInterval(updateCounter, 1000);
  }

  /* ---- complete mode ---- */
  function drawCompleteGrid(ctx, gridIndex) {
    const offset = gridIndex * PIXELS_PER_GRID;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const idx = offset + y * COLS + x;
        const color = isPrime(idx + 1) ? playerColorFor(idx) : pixelColor;
        ctx.fillStyle = color;
        ctx.fillRect(x * STEP, y * STEP, CELL_SIZE, CELL_SIZE);
      }
    }
  }

  function renderComplete(playerPrimes) {
    contexts.forEach((ctx, i) => {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      drawCompleteGrid(ctx, i);
    });
    setCounterText('COMPLETE');
    markDirty();
    clearHighlights();
    const valid = drawHighlights(playerPrimes);
    const primeCount = valid.filter(n => isPrime(n)).length;
    statusEl.textContent = valid.length
      ? `Showing complete state — ${valid.length} highlighted (${primeCount} prime, ${valid.length - primeCount} composite)`
      : 'Showing complete state. Enter prime(s) and click HIGHLIGHT.';
  }

  function showComplete(playerPrimes) {
    if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
    if (persistInterval) clearInterval(persistInterval);
    renderComplete(playerPrimes);
    showingComplete = true;
  }

  function resetToLive() {
    if (persistInterval) { clearInterval(persistInterval); persistInterval = null; }
    if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
    clearHighlights();
    clearOperatorHighlights();
    lastHighlighted = [];
    showingComplete = false;
    statusEl.textContent = '';
    startLive();
  }

  /* ---- highlights ---- */
  function clearHighlights() {
    highlightBoxes.forEach(el => el.remove());
    highlightBoxes = [];
  }

  function drawHighlights(indices) {
    if (document.getElementById('view-2d').style.display === 'none') return [];
    if (!indices.length) return [];
    const valid = [];
    indices.forEach(n => {
      if (n < 1 || n > TOTAL_PIXELS) return;
      const globalIndex = n - 1;
      const grid = Math.floor(globalIndex / PIXELS_PER_GRID);
      const local = globalIndex % PIXELS_PER_GRID;
      const x = local % COLS;
      const y = Math.floor(local / COLS);
      const canvas = document.getElementById('grid' + (grid + 1));
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const box = document.createElement('div');
      box.style.cssText =
        'position:fixed;left:' + (rect.left + x * STEP - 3) + 'px;' +
        'top:' + (rect.top + y * STEP - 3) + 'px;' +
        'width:' + (CELL_SIZE + 6) + 'px;height:' + (CELL_SIZE + 6) + 'px;' +
        'border:2px solid red;pointer-events:none;z-index:1000;' +
        'box-shadow:0 0 8px rgba(255,0,0,0.8);';
      document.body.appendChild(box);
      highlightBoxes.push(box);
      valid.push(n);
    });
    return valid;
  }

  /* ---- operator highlights (SHOW LIST) ---- */
  function clearOperatorHighlights() {
    operatorBoxes.forEach(el => el.remove());
    operatorBoxes = [];
  }

  window.__countingState.clearHighlights = clearHighlights;
  window.__countingState.clearOperatorHighlights = clearOperatorHighlights;

  function drawOperatorHighlight(n, name, hex) {
    if (document.getElementById('view-2d').style.display === 'none') return;
    const useColor = (hex && hex !== '') ? '#' + hex : '#00ffcc';
    const globalIndex = n - 1;
    const grid = Math.floor(globalIndex / PIXELS_PER_GRID);
    const local = globalIndex % PIXELS_PER_GRID;
    const x = local % COLS;
    const y = Math.floor(local / COLS);
    const canvas = document.getElementById('grid' + (grid + 1));
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const box = document.createElement('div');
    box.style.cssText =
      'position:fixed;left:' + (rect.left + x * STEP - 3) + 'px;' +
      'top:' + (rect.top + y * STEP - 3) + 'px;' +
      'width:' + (CELL_SIZE + 6) + 'px;height:' + (CELL_SIZE + 6) + 'px;' +
      'border:2px solid ' + useColor + ';pointer-events:auto;z-index:1001;cursor:crosshair;' +
      'box-shadow:0 0 10px ' + useColor + ';';
    const label = document.createElement('div');
    label.textContent = name;
    label.style.cssText =
      'position:fixed;left:' + (rect.left + x * STEP - 3) + 'px;' +
      'top:' + (rect.top + y * STEP - 18) + 'px;' +
      'background:rgba(0,0,0,0.85);color:' + useColor + ';border:1px solid ' + useColor + ';' +
      'padding:1px 6px;font-family:inherit;font-size:0.65rem;white-space:nowrap;' +
      'pointer-events:none;z-index:1002;display:none;';
    box.addEventListener('mouseenter', function() { if (lens && lens.style.display === 'none') label.style.display = 'block'; });
    box.addEventListener('mouseleave', function() { label.style.display = 'none'; });
    document.body.appendChild(box);
    document.body.appendChild(label);
    operatorBoxes.push(box);
    operatorBoxes.push(label);
  }

  function showList() {
    if (!operatorsData) return;
    showComplete([]);
    clearOperatorHighlights();
    const indices = [];
    operatorsData.forEach(op => {
      drawOperatorHighlight(op.n, op.name, op.c);
      indices.push(op.n);
    });
    window.__countingState.highlightIndices = indices;
    markHighlightsDirty();
    const primeCount = indices.filter(n => isPrime(n)).length;
    statusEl.textContent = indices.length + ' operators highlighted (' + primeCount + ' prime windows)';
  }

  operatorsData = [
    {n:  2, name:"La Checktitude",    c:""},
    {n:  3, name:"Devilin Pixy",      c:"6400C8"},
    {n:  5, name:"Spyderweb333",      c:""},
    {n: 11, name:"Morse",             c:""},
    {n: 13, name:"Mafi",              c:""},
    {n: 17, name:"YBM",               c:""},
    {n: 23, name:"The_Poet",          c:"2323ff"},
    {n: 31, name:"Turbulentflow",     c:"456838"},
    {n: 41, name:"kerdorin",          c:"77353d"},
    {n: 53, name:"ThatBomberBoi",     c:"874067"},
    {n: 61, name:"Legin1216",         c:"61ff12"},
    {n: 73, name:"Spock",             c:"627ecc"},
    {n: 83, name:"Rusty",             c:""},
    {n: 89, name:"Ozoto",             c:""},
    {n: 97, name:"Yuri",              c:""},
    {n:101, name:"Gumsk",             c:""},
    {n:109, name:"Skilnin",           c:""},
    {n:127, name:"BenR",              c:""},
    {n:131, name:"Foot",              c:""},
    {n:137, name:"Alterworld",        c:""},
    {n:211, name:"Stu",               c:"FF8200"},
    {n:251, name:"astrosurf66",       c:"21fc0d"},
    {n:257, name:"ekpyroto",          c:"156734"},
    {n:317, name:"CrossID",           c:""},
    {n:337, name:"JubiTheVille",      c:"AA1616"},

    }
    lastHighlighted = nums;
    window.__countingState.highlightIndices = nums.slice();
    markHighlightsDirty();
    if (!showingComplete) {
      clearHighlights();
      const valid = drawHighlights(nums);
      const primeCount = valid.filter(n => isPrime(n)).length;
      statusEl.textContent =
        valid.length + ' highlighted (' + primeCount + ' prime, ' +
        (valid.length - primeCount) + ' composite)';
    } else {
      clearHighlights();
      const valid = drawHighlights(nums);
      const primeCount = valid.filter(n => isPrime(n)).length;
      statusEl.textContent = valid.length
        ? `Showing complete state — ${valid.length} highlighted (${primeCount} prime, ${valid.length - primeCount} composite)`
        : 'Showing complete state. Enter prime(s) and click HIGHLIGHT.';
    }

  function repositionHighlights() {
    if (highlightBoxes.length) {
      const nums = lastHighlighted;
      if (nums.length) {
        const boxes = highlightBoxes;
        highlightBoxes = [];
        boxes.forEach(el => el.remove());
        drawHighlights(nums);
      }
    }
    if (operatorBoxes.length && operatorsData) {
      const boxes = operatorBoxes;
      operatorBoxes = [];
      boxes.forEach(el => el.remove());
      operatorsData.forEach(op => drawOperatorHighlight(op.n, op.name, op.c));

    if (e.key === 'Enter') doHighlight();
  });

  /* ---- shift+hover zoom lens ---- */
  const ZOOM_RADIUS = 7;
  const ZOOM_CELL = 16;
  const LENS_CELLS = ZOOM_RADIUS * 2 + 1;
  const LENS_SIZE = LENS_CELLS * ZOOM_CELL;

  const lens = document.getElementById('zoom-lens');
  const lc = document.getElementById('zoom-canvas');
  lc.width = LENS_SIZE;
  lc.height = LENS_SIZE;
  const lctx = lc.getContext('2d');

  let shiftHeld = false;

  function updateCanvasRects() {
    for (var ri = 0; ri < canvases.length; ri++) {
      canvasRects[ri] = canvases[ri].getBoundingClientRect();
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Shift') {
      shiftHeld = !shiftHeld;
      updateCanvasRects();
      if (!shiftHeld) lens.style.display = 'none';
    }
  });
  window.addEventListener('blur', function() {
    shiftHeld = false;
    lens.style.display = 'none';
  });

  function hideLens() {
    lens.style.display = 'none';
  }

  function updateLens(mx, my) {
    var targetGrid = -1, relX = 0, relY = 0;
    for (var i = 0; i < canvases.length; i++) {
      var r = canvasRects[i];
      if (r && mx >= r.left && mx <= r.right && my >= r.top && my <= r.bottom) {
        targetGrid = i; relX = mx - r.left; relY = my - r.top; break;
      }
    }
    if (targetGrid < 0) { lens.style.display = 'none'; return; }

    var cellX = Math.floor(relX / STEP);
    var cellY = Math.floor(relY / STEP);
    if (cellX < 0 || cellX >= COLS || cellY < 0 || cellY >= ROWS) { lens.style.display = 'none'; return; }

    var leftCount = Math.min(cellX, ZOOM_RADIUS);
    var topCount = Math.min(cellY, ZOOM_RADIUS);
    var rightCount = Math.min(COLS - 1 - cellX, ZOOM_RADIUS);
    var bottomCount = Math.min(ROWS - 1 - cellY, ZOOM_RADIUS);
    var cellLx = ZOOM_RADIUS;  // cursor always at center of lens
    var cellLy = ZOOM_RADIUS;

    lctx.fillStyle = '#0a0a0a';
    lctx.fillRect(0, 0, LENS_SIZE, LENS_SIZE);

    for (var ly = cellLy - topCount; ly <= cellLy + bottomCount; ly++) {
      for (var lx = cellLx - leftCount; lx <= cellLx + rightCount; lx++) {
        var gx = cellX + (lx - cellLx);
        var gy = cellY + (ly - cellLy);
        var globalIdx = targetGrid * PIXELS_PER_GRID + gy * COLS + gx;
        var color;
        if (showingComplete || litPixels.has(globalIdx)) {
          color = isPrime(globalIdx + 1) ? '#ffffff' : 'rgba(4,135,157,1)';
        } else {
          color = '#0a0a0a';
        }
        var dx = lx * ZOOM_CELL;
        var dy = ly * ZOOM_CELL;
        lctx.fillStyle = color;
        lctx.fillRect(dx, dy, ZOOM_CELL, ZOOM_CELL);

        var opInfo = opLookup[globalIdx];
        if (opInfo) {
          lctx.fillStyle = 'rgba(0,0,0,0.7)';
          lctx.fillRect(dx, dy, ZOOM_CELL, 12);
          lctx.fillStyle = '#ffffff';
          lctx.font = '9px "IBM Plex Mono", monospace';
          lctx.fillText(opInfo.name, dx + 2, dy + 11);
        }
      }
    }

    var hoverIdx = targetGrid * PIXELS_PER_GRID + cellY * COLS + cellX;
    var hoverOp = opLookup[hoverIdx];
    var hoverColor = (hoverOp && hoverOp.color !== '') ? '#' + hoverOp.color : '#ff3333';

    var cdx = cellLx * ZOOM_CELL;
    var cdy = cellLy * ZOOM_CELL;
    lctx.fillStyle = hoverColor;
    lctx.fillRect(cdx, cdy, ZOOM_CELL, 1);
    lctx.fillRect(cdx, cdy + ZOOM_CELL - 1, ZOOM_CELL, 1);
    lctx.fillRect(cdx, cdy, 1, ZOOM_CELL);
    lctx.fillRect(cdx + ZOOM_CELL - 1, cdy, 1, ZOOM_CELL);

    var lensX = mx + 18;
    var lensY = my - LENS_SIZE / 2;
    if (lensX + LENS_SIZE > window.innerWidth - 10) lensX = mx - LENS_SIZE - 18;
    if (lensY < 5) lensY = 5;
    if (lensY + LENS_SIZE > window.innerHeight - 5) lensY = window.innerHeight - LENS_SIZE - 5;

    lens.style.left = lensX + 'px';
    lens.style.top = lensY + 'px';
    lens.style.display = 'block';

    var popupGlobalIdx = targetGrid * PIXELS_PER_GRID + cellY * COLS + cellX;
    var popupInfo = opLookup[popupGlobalIdx];
    if (popupInfo) {
      var popColor = (popupInfo.color !== '') ? '#' + popupInfo.color : '#00ffcc';
      lensPopup.textContent = popupInfo.name;
      lensPopup.style.color = popColor;
      lensPopup.style.borderColor = popColor;
      lensPopup.style.left = (mx + 12) + 'px';
      lensPopup.style.top = (my - 28) + 'px';
      lensPopup.style.display = 'block';
    } else {
      lensPopup.style.display = 'none';
    }
  }

  /* ---- operator popup for zoom lens ---- */
  var lensPopup = document.createElement('div');
  lensPopup.style.cssText =
    'position:fixed;display:none;z-index:10001;pointer-events:none;' +
    'background:rgba(0,0,0,0.9);color:#00ffcc;border:1px solid #00ffcc;' +
    'padding:2px 8px;font-family:inherit;font-size:0.7rem;white-space:nowrap;';
  document.body.appendChild(lensPopup);

  var lastLensTime = 0;
  document.addEventListener('mousemove', function(e) {
    if (!shiftHeld) {
      if (lens.style.display !== 'none') lens.style.display = 'none';
      lensPopup.style.display = 'none';
      return;
    }
    var now = Date.now();
    if (now - lastLensTime < 40) return;
    lastLensTime = now;
    updateCanvasRects();
    updateLens(e.clientX, e.clientY);
  });

  /* ---- startup ---- */
  contexts.forEach(ctx => {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  });
  startLive();

  /* ---- reposition highlights on viewport changes ---- */
  window.addEventListener('scroll', repositionHighlights);
  window.addEventListener('resize', repositionHighlights);

  var lastTraceState = null;
  var traceTick = null;
  function fmtElapsed(s) {
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    if (h > 0) return h + 'h ' + m + 'm';
    if (m > 0) return m + 'm ' + sec + 's';
    return sec + 's';
  }
  function renderTrace(data) {
    var el = document.getElementById('traceStatus');
    if (!el) return;
    if (data.state === 'ACTIVE') {
      el.innerHTML = '<span class="trace-dot trace-dot--active"></span><span class="trace-label">TRACE: ACTIVE</span>';
    } else if (data.state === 'LOST' && data.lastSeenAt) {
      var then = new Date(data.lastSeenAt);
      var elapsed = (Date.now() - then.getTime()) / 1000;
      el.innerHTML = '<span class="trace-dot trace-dot--lost"></span><span class="trace-label">TRACE: LOST</span> <span class="trace-time">-' + fmtElapsed(elapsed) + '</span>';
    } else {
      el.innerHTML = '';
    }
  }
  function updateTrace() {
    fetch('../status/trace.json').then(function(r) {
      if (!r.ok) throw new Error();
      return r.json();
    }).then(function(data) {
      renderTrace(data);
      if (lastTraceState !== null && data.state !== lastTraceState) {
        var audio = new Audio();
        audio.src = data.state === 'ACTIVE' ? '../data/trace-on.mp3' : '../data/trace-off.mp3';
        audio.volume = 0.3;
        audio.play().catch(function(){});
      }
      lastTraceState = data.state;
      if (data.state === 'LOST') {
        if (traceTick) clearInterval(traceTick);
        traceTick = setInterval(function() { renderTrace(data); }, 1000);
      } else {
        if (traceTick) { clearInterval(traceTick); traceTick = null; }
      }
    }).catch(function() {
      var el = document.getElementById('traceStatus');
      if (el) el.innerHTML = '';
    });
  }
  updateTrace();
  setInterval(updateTrace, 30000);
})();

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let initialized = false;
let renderer, scene, camera, controls;
let meshes = [];
let offscreenCtxs = [];
let offscreenTextures = [];
let tooltip = null;
let animFrameId = null;
var contentW, contentH, pixelW, pixelH;

function getGlobalIndex(gridIndex, uv, S) {
  var col = Math.floor(uv.x * S.COLS);
  var row = Math.floor((1 - uv.y) * S.ROWS);
  if (col < 0 || col >= S.COLS || row < 0 || row >= S.ROWS) return -1;
  return gridIndex * S.PIXELS_PER_GRID + row * S.COLS + col;
}

function copyCanvases(S) {
  for (var i = 0; i < 3; i++) {
    var src = S.canvases[i];
    offscreenCtxs[i].drawImage(src, 0, 0, contentW, contentH, 0, 0, contentW, contentH);
  }
}

function updateHighlights(S) {
  for (var i = 0; i < meshes.length; i++) {
    var m = meshes[i];
    for (var j = m.children.length - 1; j >= 0; j--) {
      if (m.children[j].userData.isHighlight) m.remove(m.children[j]);
    }
  }
  var indices = S.highlightIndices;
  if (!indices || !indices.length) return;
  var glowW = pixelW * 1.5;
  var glowH = pixelH * 1.5;
  var glowGeo = new THREE.PlaneGeometry(glowW, glowH);
  for (var k = 0; k < indices.length; k++) {
    var n = indices[k];
    var globalIdx = n - 1;
    var gi = Math.floor(globalIdx / S.PIXELS_PER_GRID);
    var local = globalIdx % S.PIXELS_PER_GRID;
    var col = local % S.COLS;
    var row = Math.floor(local / S.COLS);
    var mesh = meshes[gi];
    if (!mesh) continue;
    var lx = col * pixelW + pixelW / 2 - contentW / 2;
    var ly = -(row * pixelH + pixelH / 2) + contentH / 2;
    var opInfo = S.opLookup[globalIdx];
    var color;
    if (opInfo && opInfo.color && opInfo.color !== '') {
      color = parseInt('0x' + opInfo.color, 16);
    } else if (opInfo) {
      color = 0x00ffcc;
    } else {
      color = 0xff0000;
    }
    var mat = new THREE.MeshBasicMaterial({
      color: color, transparent: true, opacity: 0.35,
      side: THREE.DoubleSide, depthWrite: false,
    });
    var glow = new THREE.Mesh(glowGeo, mat);
    glow.position.set(lx, ly, 0.005);
    glow.userData.isHighlight = true;
    mesh.add(glow);
  }
}

function initScene() {
  if (initialized) { onResize(); return; }
  initialized = true;

  var container = document.getElementById('view-3d');
  if (!container) return;
  var S = window.__countingState;
  if (!S) return;

  var cw = container.clientWidth || 1200;
  var ch = container.clientHeight || 600;

  contentW = S.COLS * S.CELL_SIZE + (S.COLS - 1) * S.GAP;
  contentH = S.ROWS * S.CELL_SIZE + (S.ROWS - 1) * S.GAP;
  pixelW = contentW / S.COLS;
  pixelH = contentH / S.ROWS;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, cw / ch, 1, 10000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0a0a0a);
  renderer.setSize(cw, ch);
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 200;
  controls.maxDistance = 8000;
  controls.update();

  offscreenCtxs = [];
  offscreenTextures = [];
  for (var i = 0; i < 3; i++) {
    var oc = document.createElement('canvas');
    oc.width = contentW;
    oc.height = contentH;
    offscreenCtxs.push(oc.getContext('2d'));
    var tex = new THREE.CanvasTexture(oc);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    offscreenTextures.push(tex);
  }

  var R = contentW * Math.sqrt(3) / 6;
  var geo = new THREE.PlaneGeometry(contentW, contentH);
  var edgeGeo = new THREE.EdgesGeometry(geo);

  for (var i = 0; i < 3; i++) {
    var theta = i * Math.PI * 2 / 3;
    var mat = new THREE.MeshBasicMaterial({
      map: offscreenTextures[i], side: THREE.DoubleSide,
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(R * Math.sin(theta), 0, R * Math.cos(theta));
    mesh.rotation.y = theta;
    mesh.userData.gridIndex = i;
    scene.add(mesh);

    var edgeMat = new THREE.LineBasicMaterial({

  var triMat = new THREE.MeshBasicMaterial({
    color: 0x222222, side: THREE.DoubleSide,

    -halfW, 0, R,

  triGeo.setAttribute('position', new THREE.BufferAttribute(triPos, 3));
  triGeo.setIndex([0, 1, 2]);
  triGeo.computeVertexNormals();
  var topTri = new THREE.Mesh(triGeo, triMat);
  topTri.position.y = contentH / 2;
  scene.add(topTri);
  var bottomTri = new THREE.Mesh(triGeo.clone(), triMat);
  bottomTri.position.y = -contentH / 2;
  scene.add(bottomTri);

  var halfH = contentH / 2;
  var fovRad = THREE.MathUtils.degToRad(50);
  var d = (halfH / Math.tan(fovRad / 2)) * 1.4;
  camera.position.set(d * 0.5, d * 0.35, d * 0.7);
  controls.update();

  tooltip = document.createElement('div');
  tooltip.id = 'tower-tooltip';
  tooltip.style.cssText =
    'position:fixed;display:none;z-index:10001;pointer-events:none;' +
    'background:rgba(0,0,0,0.9);color:#00ffcc;border:1px solid #00ffcc;' +
    'padding:2px 8px;font-family:"IBM Plex Mono","Courier New",monospace;' +
    'font-size:0.7rem;white-space:nowrap;';

  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();

  renderer.domElement.addEventListener('pointermove', function(event) {
    var rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    var intersects = raycaster.intersectObjects(meshes, false);

      var gIdx = getGlobalIndex(hit.object.userData.gridIndex, hit.uv, S);
      if (gIdx >= 0) {
        var opInfo = S.opLookup[gIdx];
        if (opInfo) {
          var col = (opInfo.color && opInfo.color !== '') ? '#' + opInfo.color : '#00ffcc';
          tooltip.textContent = opInfo.name;
          tooltip.style.color = col;

          var col = (opInfo.color && opInfo.color !== '') ? '#' + opInfo.color : '#00ffcc';
          tooltip.textContent = opInfo.name;
          tooltip.style.color = col;
          tooltip.style.borderColor = col;
          tooltip.style.left = (event.clientX + 14) + 'px';
          tooltip.style.top = (event.clientY - 30) + 'px';
          tooltip.style.display = 'block';
          tooltipTimer = setTimeout(function() { tooltip.style.display = 'none'; }, 3000);
          return;
        }
      }
    }
    tooltip.style.display = 'none';
  });

  S.dirty = true;
  S.highlightsDirty = true;

  function animate() {
    animFrameId = requestAnimationFrame(animate);
    if (S.dirty) {
      copyCanvases(S);
      offscreenTextures.forEach(function(t) { t.needsUpdate = true; });
      S.dirty = false;
    }
    if (S.highlightsDirty) {
      updateHighlights(S);
      S.highlightsDirty = false;
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
}

function onResize() {
  if (!camera || !renderer) return;
  var container = document.getElementById('view-3d');
  if (!container) return;
  var cw = container.clientWidth;
  var ch = container.clientHeight;
  if (cw === 0 || ch === 0) return;
  camera.aspect = cw / ch;
  camera.updateProjectionMatrix();
  renderer.setSize(cw, ch);
}

window.addEventListener('resize', onResize);
window.__initTower3D = initScene;
</script>
</body>
