<!-- === TOWER CONSOLE + 3D PARTICLES BACKGROUND === -->
<div class="terminal-console" id="db-console">
  <div class="terminal-header">
    <span class="terminal-title">Tower</span>
    <span class="terminal-status">connected</span>
  </div>

    <span class="prompt">&gt;</span>
    <input type="text" id="search-input" placeholder="waiting for command..." autocomplete="off" autofocus="">
  </div>
</div>

<!-- Canvas 3D Background -->
<canvas id="three-bg"></canvas>

<style>
.terminal-console { 
  width: 100%; 
  max-width: 1000px; 
  margin: 40px auto; 
  background: #0d1117; 
  border: 2px solid #21262d; 
  border-radius: 10px; 
  font-family: 'Courier New', Consolas, monospace; 
  color: #c9d1d9; 
  overflow: hidden; 
  box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
  position: relative; 
  z-index: 10; 
}

.terminal-header { 
  background: #161b22; 
  padding: 10px 15px; 
  border-bottom: 1px solid #30363d; 
  display: flex; 
  justify-content: space-between; 
}

.terminal-title { color: #58a6ff; font-weight: bold; }
.terminal-status { color: #39d353; font-size: 13px; }

.terminal-body { 
  height: 480px; 
  padding: 15px; 
  overflow-y: auto; 
  background: #0d1117; 
  line-height: 1.55; 
}

.prompt { color: #39d353; margin-right: 10px; }

.terminal-input-line { 
  background: #161b22; 
  padding: 12px 15px; 
  display: flex; 
  align-items: center; 
  border-top: 1px solid #30363d; 
}

#search-input { 
  background: transparent; 
  border: none; 
  color: #c9d1d9; 
  font-family: inherit; 
  font-size: 16px; 
  flex: 1; 
  outline: none; 
}

/* Scrollbar*/
.terminal-body::-webkit-scrollbar { width: 8px; }
.terminal-body::-webkit-scrollbar-track { background: #161b22; }
.terminal-body::-webkit-scrollbar-thumb { background: #39d353; border-radius: 4px; }

/* 3D Background */
#three-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
  opacity: 0.35;
}
</style>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
// ==================== THREE.JS 3D BACKGROUND ====================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ 
  canvas: document.getElementById('three-bg'), 
  alpha: true 
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

camera.position.z = 32;

const geometry = new THREE.BufferGeometry();
const vertices = [];
const colors = [];

for (let i = 0; i < 1500; i++) {
  vertices.push(THREE.MathUtils.randFloatSpread(140));
  vertices.push(THREE.MathUtils.randFloatSpread(140));
  vertices.push(THREE.MathUtils.randFloatSpread(70));
  
  colors.push(0.22, 0.85, 0.35);
}

geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.22,
  vertexColors: true,
  transparent: true,
  opacity: 0.75
});

const points = new THREE.Points(geometry, material);
scene.add(points);

function animate() {
  requestAnimationFrame(animate);
  points.rotation.y += 0.0004;
  points.rotation.x += 0.0002;
  renderer.render(scene, camera);
}
animate();

// Responsive
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

<script>
// ==================== CONSOLE SCRIPT ====================
document.getElementById('search-input').addEventListener('keypress', async function(e) {
    if (e.key !== 'Enter') return;

    let input = this.value.trim();
    if (!input) return;

    const output = document.getElementById('terminal-output');
    output.innerHTML += `<p><span class="prompt">&gt;</span> ${input}</p>`;
    output.innerHTML += `<p><em>Searching...</em></p>`;
    output.scrollTop = output.scrollHeight;

    // === Vérification simple des commandes ===
    const parts = input.split(/\s+/);
    const firstWord = parts[0].toLowerCase();
    const commandsNeedingArg = ['whois', 'whatis', 'search'];

    if (commandsNeedingArg.includes(firstWord) && parts.length < 2) {
        output.querySelector('em').remove();
        output.innerHTML += `<p style="color:#f85149;">Usage: ${firstWord} &lt;target&gt;</p>`;
        this.value = '';
        output.scrollTop = output.scrollHeight;
        return;
    }

    // === Envoi du texte complet ===
    let params = new URLSearchParams();
    params.append('token', window.TOWER_TOKEN);
    params.append('q', input);

    try {
        const response = await fetch(`/wp-json/tower/v1/search?${params.toString()}`);
        
        if (!response.ok) throw new Error('Access denied');

        const results = await response.json();

        output.querySelector('em').remove();

        if (Array.isArray(results) && results.length > 0) {
            results.forEach(item => {
                output.innerHTML += `<p style="color:#c9d1d9;">${item.content || item.title}</p>`;
            });
        } else {
            output.innerHTML += `<p style="color:#f85149;">memory not yet logged in Tower</p>`;
        }
    } catch (err) {
        output.querySelector('em')?.remove();
        output.innerHTML += `<p style="color:#f85149;">Error: ${err.message}</p>`;
    }

    this.value = '';
    output.scrollTop = output.scrollHeight;
});
</script>
