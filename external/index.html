<style class="wpcode-css-snippet">/* =============================================
   DATA LOSS 
   ============================================= */

.wp-block-post-featured-image,
.wp-block-post-featured-image img,
.wp-post-image,
article .wp-post-image,
.post-thumbnail img,
figure.wp-block-post-featured-image img {
    position: relative !important;
    filter: brightness(1.25) contrast(1.45) saturate(0.75) !important;
}

/* Overlay ultra forcé */
.wp-block-post-featured-image::after,
.wp-block-post-featured-image img::after,
.wp-post-image::after,
.post-thumbnail img::after,
figure.wp-block-post-featured-image img::after,
figure.wp-block-post-featured-image::after {
    content: "" !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 999 !important;
    background-image: url('https://recalldreams.dev/wp-content/uploads/2026/06/opening_door_protocol.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
    mix-blend-mode: screen !important;
    opacity: 0.94 !important;
    pointer-events: none !important;
    mask-image: linear-gradient(
        to bottom,
        transparent 2%,
        rgba(0,0,0,0.95) 18%,
        rgba(0,0,0,0.5) 48%,
        rgba(0,0,0,0.95) 82%,
        transparent 98%
    ) !important;
}</style><style class="wpcode-css-snippet">/* DATA LOSS */
.data-loss,
img.data-loss {
    position: relative;
    display: block;
    filter: brightness(1.15) contrast(1.35);
}

.data-loss::after,
img.data-loss::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 5;
    background-image: url('https://recalldreams.dev/wp-content/uploads/2026/06/opening_door_protocol.jpg');
    background-size: cover;
    background-position: center;
    mix-blend-mode: screen;
    opacity: 0.92;
    pointer-events: none;
    mask-image: linear-gradient(
        to bottom,
        transparent 3%,
        rgba(0,0,0,0.98) 20%,
        rgba(0,0,0,0.55) 50%,
        rgba(0,0,0,0.98) 80%,
        transparent 97%
    );
}

.data-loss::before,
img.data-loss::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 6;
    background: rgba(209, 220, 224, 0.35);
    mix-blend-mode: multiply;
    pointer-events: none;
}</style>
